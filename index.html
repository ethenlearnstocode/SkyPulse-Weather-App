<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyPulse Global Weather App</title>
    
    <style>
        /* Base page setup */
        body {
            font-family: Arial, sans-serif;
            background-color: #121826;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            transition: background 0.4s ease;
        }

        /* Weather condition backgrounds */
        body.sunny {
            background-image: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), 
                              url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1000&q=80');
        }

        body.cloudy {
            background-image: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), 
                              url('https://images.unsplash.com/photo-1534088568595-a066f410bcda?auto=format&fit=crop&w=1000&q=80');
        }

        body.rainy {
            background-image: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), 
                              url('https://images.unsplash.com/photo-1519692933481-e162a57d6721?auto=format&fit=crop&w=1000&q=80');
        }

        /* Container card */
        .weather-card {
            background: rgba(30, 41, 59, 0.88);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        /* Header layout */
        .top-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #ffffff;
            font-size: 1rem;
        }

        button {
            padding: 10px 15px;
            border-radius: 6px;
            border: none;
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Main weather display */
        .weather-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .city-title {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .weather-status {
            color: #94a3b8;
            font-size: 1rem;
        }

        .temp-text {
            font-size: 3.5rem;
            font-weight: bold;
            color: #38bdf8;
        }

        /* Extra Info Grid (3 Columns) */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .detail-box {
            background-color: rgba(15, 23, 42, 0.6);
            padding: 12px 8px;
            border-radius: 8px;
            border: 1px solid #334155;
            text-align: center;
        }

        .detail-title {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
        }

        /* Hourly Forecast Section */
        .hourly-section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 0.95rem;
            color: #38bdf8;
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hourly-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .hourly-box {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            min-width: 65px;
            text-align: center;
            flex: 1;
        }

        .hourly-time {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .hourly-temp {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .hourly-rain {
            font-size: 0.75rem;
            color: #38bdf8;
        }

        footer {
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
            border-top: 1px solid #334155;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="weather-card">
        
        <div class="top-bar">
            <input type="text" id="searchInput" placeholder="Enter any village, town, city or postcode...">
            <button id="searchBtn">Search</button>
        </div>

        <div class="weather-display">
            <div>
                <h2 id="cityName" class="city-title">Welcome!
