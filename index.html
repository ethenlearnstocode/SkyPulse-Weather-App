<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyPulse Weather App</title>
    
    <style>
        /* Base page setup */
        body {
            font-family: Arial, sans-serif;
            background-color: #121826;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            transition: background 0.4s ease;
        }

        /* Weather condition backgrounds */
        body.sunny {
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                              url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1000&q=80');
        }

        body.cloudy {
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                              url('https://images.unsplash.com/photo-1534088568595-a066f410bcda?auto=format&fit=crop&w=1000&q=80');
        }

        body.rainy {
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                              url('https://images.unsplash.com/photo-1519692933481-e162a57d6721?auto=format&fit=crop&w=1000&q=80');
        }

        /* Container card */
        .weather-card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        /* Header layout */
        .top-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #ffffff;
            font-size: 1rem;
        }

        button {
            padding: 10px 15px;
            border-radius: 6px;
            border: none;
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Main weather display */
        .weather-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .city-title {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .weather-status {
            color: #94a3b8;
            font-size: 1rem;
        }

        .temp-text {
            font-size: 3.5rem;
            font-weight: bold;
            color: #38bdf8;
        }

        /* Extra Info Grid (3 Columns) */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .detail-box {
            background-color: rgba(15, 23, 42, 0.6);
            padding: 12px 8px;
            border-radius: 8px;
            border: 1px solid #334155;
            text-align: center;
        }

        .detail-title {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
        }

        footer {
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
            border-top: 1px solid #334155;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="weather-card">
        
        <div class="top-bar">
            <input type="text" id="searchInput" placeholder="Type a UK postcode or city...">
            <button id="searchBtn">Search</button>
        </div>

        <div class="weather-display">
            <div>
                <h2 id="cityName" class="city-title">Welcome!</h2>
                <p id="weatherDesc" class="weather-status">Type a postcode above to get the weather</p>
            </div>
            <div id="temperature" class="temp-text">--°C</div>
        </div>

        <div class="details-grid">
            <div class="detail-box">
                <div class="detail-title">Feels Like</div>
                <div id="feelsLike" class="detail-value">--°C</div>
            </div>
            <div class="detail-box">
                <div class="detail-title">Rain Chance</div>
                <div id="rainChance" class="detail-value">--%</div>
            </div>
            <div class="detail-box">
                <div class="detail-title">Wind Speed</div>
                <div id="windSpeed" class="detail-value">-- mph</div>
            </div>
        </div>

        <footer>
            <p>Data provided by <strong>UK Met Office</strong> models</p>
        </footer>

    </div>

    <script>
        // Get HTML elements
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');

        // Search button click handler
        searchBtn.addEventListener('click', function() {
            const query = searchInput.value.trim();
            if (query !== "") {
                findLocation(query);
            }
        });

        // Also allow pressing "Enter" key inside the search box
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (query !== "") {
                    findLocation(query);
                }
            }
        });

        // Step 1: Find coordinates from city/postcode
        async function findLocation(place) {
            try {
                const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(place)}&count=1&language=en&format=json`;
                const response = await fetch(geoUrl);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    const firstResult = data.results[0];
                    getMetOfficeWeather(firstResult.latitude, firstResult.longitude, firstResult.name, firstResult.country);
                } else {
                    alert("Location not found. Please try another postcode or city.");
                }
            } catch (error) {
                alert("Error searching for location.");
            }
        }

        // Step 2: Fetch weather data using Met Office model
        async function getMetOfficeWeather(lat, lon, city, country) {
            try {
                // Fetching temperature, feels like, precipitation chance, wind speed, and weather code
                const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,precipitation_probability,wind_speed_10m,weather_code&wind_speed_unit=mph&models=ukmo_seamless`;
                const response = await fetch(weatherUrl);
                const data = await response.json();

                const currentTemp = Math.round(data.current.temperature_2m);
                const feelsLikeTemp = Math.round(data.current.apparent_temperature);
                const precipProb = data.current.precipitation_probability ?? 0;
                const wind = Math.round(data.current.wind_speed_10m);
                const weatherCode = data.current.weather_code;

                // Update HTML text
                document.getElementById('cityName').textContent = `${city}, ${country || ''}`;
                document.getElementById('temperature').textContent = `${currentTemp}°C`;
                document.getElementById('feelsLike').textContent = `${feelsLikeTemp}°C`;
                document.getElementById('rainChance').textContent = `${precipProb}%`;
                document.getElementById('windSpeed').textContent = `${wind} mph`;

                // Update background theme
                setTheme(weatherCode);

            } catch (error) {
                alert("Could not load weather data.");
            }
        }

        // Step 3: Change background based on weather code
        function setTheme(code) {
            // Remove previous theme classes
            document.body.className = '';

            if (code === 0 || code === 1) {
                document.body.classList.add('sunny');
                document.getElementById('weatherDesc').textContent = 'Sunny / Clear';
            } else if (code === 2 || code === 3) {
                document.body.classList.add('cloudy');
                document.getElementById('weatherDesc').textContent = 'Cloudy';
            } else {
                document.body.classList.add('rainy');
                document.getElementById('weatherDesc').textContent = 'Rainy';
            }
        }
    </script>

</body>
</html>
